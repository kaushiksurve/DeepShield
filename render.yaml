services:
  - type: web
    name: deepshield-api
    runtime: python
    rootDir: backend
    buildCommand: "apt-get install -y libgl1-mesa-glx libglib2.0-0 2>/dev/null || true && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MAX_UPLOAD_MB
        value: "100"
    plan: free
